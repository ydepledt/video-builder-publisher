[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-builder-publisher"
version = "0.2.0"
description = "Shared primitives for building, validating, queueing, publishing and measuring generated videos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<4",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]
all = [
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
